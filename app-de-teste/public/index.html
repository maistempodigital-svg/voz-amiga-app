<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- SEM ZOOM: a criança não consegue ampliar a tela sem querer (pinça ou toque duplo) -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="referrer" content="no-referrer" />
    <title>Voz Amiga (teste)</title>
    <style id="expo-reset">
      html, body { height: 100%; }
      body { overflow: hidden; touch-action: manipulation; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; overscroll-behavior: none; }
      #root { display: flex; height: 100%; flex: 1; }
    </style>
    <script>
      // bloqueia zoom por gesto (iPhone ignora user-scalable) e Ctrl + roda do mouse
      document.addEventListener('gesturestart', function (e) { e.preventDefault(); }, { passive: false });
      document.addEventListener('touchmove', function (e) { if (e.touches && e.touches.length > 1) e.preventDefault(); }, { passive: false });
      document.addEventListener('wheel', function (e) { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
    </script>
  </head>
  <body>
    <noscript>Ative o JavaScript para usar o app.</noscript>
    <div id="root"></div>
  </body>
</html>
