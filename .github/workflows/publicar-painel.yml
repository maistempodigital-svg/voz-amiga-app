# Publica o painel do dono (pasta painel/) no Firebase Hosting do Voz Amiga: https://voz-amiga-651a5.web.app
name: Publicar painel
on: workflow_dispatch
jobs:
  painel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 20 }
      - name: Conferir o painel (erro de código não pode ir para o ar)
        run: |
          python3 -c "import re;s=open('painel/index.html').read();m=re.findall(r'<script type=\"module\">(.*?)</script>',s,re.S);open('/tmp/p.mjs','w').write(re.sub(r'^import .*$','',m[0],flags=re.M))"
          node --check /tmp/p.mjs
      - name: Publicar
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -e
          if [ -z "$SA" ]; then echo "::error::Falta o segredo FIREBASE_SERVICE_ACCOUNT"; exit 1; fi
          echo "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx -y firebase-tools@13 deploy --only hosting --project voz-amiga-651a5 --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
