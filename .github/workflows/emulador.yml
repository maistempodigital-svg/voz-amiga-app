# Abre o APK de teste num celular virtual e tira fotos da tela.
name: Testar APK no celular virtual
on: workflow_dispatch
permissions:
  contents: write
jobs:
  emu:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Pegar o APK
        run: git fetch origin apk-saida --depth 1 && git show origin/apk-saida:VozAmiga-TESTE-v14.8.apk > app.apk && ls -la app.apk
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash .github/android-test/smoke-test.sh app.apk com.vozamiga.rotinateste
      - name: Guardar as fotos num ramo separado
        if: always()
        run: |
          mkdir -p /tmp/f && cp -r test-output/. /tmp/f/ 2>/dev/null || true
          cd /tmp/f && git init -q -b emu-saida && git add . && git -c user.name=bot -c user.email=bot@local commit -q -m "fotos" && git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" emu-saida
