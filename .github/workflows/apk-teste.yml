# Monta o APK de TESTE (com.vozamiga.rotinateste): instala AO LADO do app da loja, não substitui nada.
name: APK de teste
on: workflow_dispatch
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Montar a parte web do app
        working-directory: app-de-teste
        run: |
          npm ci --no-audit --no-fund
          rm -rf src && mkdir -p src && cp -r ../rotina-amiga src/rotina-amiga
          npx expo export -p web --output-dir dist
      - name: Colocar a parte web dentro do APK
        run: |
          rm -rf apk-teste/app/src/main/assets && mkdir -p apk-teste/app/src/main/assets
          cp -r app-de-teste/dist/. apk-teste/app/src/main/assets/
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Montar o APK
        working-directory: apk-teste
        env:
          VERSAO_CODIGO: ${{ github.run_number }}
          VERSAO_NOME: 14.8-teste.${{ github.run_number }}
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: VozAmiga-TESTE-v14.8
          path: apk-teste/app/build/outputs/apk/debug/*.apk
