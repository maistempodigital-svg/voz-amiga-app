# Avisa quando alguma biblioteca do app, do servidor ou do Android tiver falha conhecida.
version: 2
updates:
  - package-ecosystem: npm
    directory: /app-de-teste
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    directory: /servidor/functions
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
  - package-ecosystem: gradle
    directory: /apk-teste
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
